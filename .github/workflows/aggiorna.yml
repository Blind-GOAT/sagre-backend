name: Aggiorna sagre
on:
  schedule:
    - cron: "17 3 * * *"     # ogni giorno alle 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python collector/main.py
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      - name: Salva le modifiche
        run: |
          git config user.name "sagre-bot"
          git config user.email "sagre-bot@users.noreply.github.com"
          git add docs/sagre.json data/geocache.json
          git diff --cached --quiet || (git commit -m "Aggiorna dati" && git push)
